# Apache vhost for https://thewell.wellspringstudiollc.com (TLS added by certbot).
# Temporary home until the church has its own domain. Server copy:
# /etc/apache2/sites-available/thewell.conf. Files are published by the thewell-builder container.
<VirtualHost *:80>
    ServerName thewell.wellspringstudiollc.com
    DocumentRoot /opt/thewell/site/current

    <Directory /opt/thewell/site>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorDocument 404 /404.html

    # Astro fingerprints these file names, so they can be cached for good.
    <LocationMatch "^/_astro/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/thewell-error.log
    CustomLog ${APACHE_LOG_DIR}/thewell-access.log combined
</VirtualHost>
