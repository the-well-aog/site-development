name: Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Republish daily, just after midnight in Pocola, so the verse of the day changes with the date
    # (and the YouTube feed is fetched again, when it is switched on). No API key.
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://the-well-aog.github.io
          BASE_PATH: /site-development
          STRAPI_URL: https://cms.wellspringstudiollc.com
          ASTRO_TELEMETRY_DISABLED: 1
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          path: dist

  deploy:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
